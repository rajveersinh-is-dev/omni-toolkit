[package]
name = "omni-text"
version = "0.1.0"
edition = "2021"
description = "Omni-format transpiler (JSON/YAML/TOML/XML/CSV/INI), diffing, regex studio, and string transformations for OMNI"
authors = ["Rajveersinh Pardeshi <daveaddams91@gmail.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
omni-core = { workspace = true }
omni-registry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

serde_yaml = "0.9"
toml = "0.8"
quick-xml = { version = "0.37", features = ["serialize"] }
csv = "1.3"
similar = { workspace = true }
regex = { workspace = true }
encoding_rs = "0.8"

[dev-dependencies]
tokio = { workspace = true }
