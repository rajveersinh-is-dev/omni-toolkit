[package]
name = "omni-media"
version = "0.1.0"
edition = "2021"
description = "Media containers, audio metrics (LUFS/silence), image processing, color science, 3D and shader tools for OMNI"
authors = ["Rajveersinh Pardeshi <daveaddams91@gmail.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
omni-core = { workspace = true }
omni-registry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
byteorder = "1.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico", "qoi"] }

[dev-dependencies]
tokio = { workspace = true }
