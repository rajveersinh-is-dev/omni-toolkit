[package]
name = "omni-filesystems"
version = "0.1.0"
edition = "2021"
description = "Embedded SQL engine, binary serialization decoders (Protobuf/MsgPack/CBOR/ASN.1), archive toolkit (TAR/GZIP/ZIP), and MBR/GPT/FAT/ext filesystem inspector for OMNI"
authors = ["Rajveersinh Pardeshi <daveaddams91@gmail.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
omni-core = { workspace = true }
omni-registry = { workspace = true }
omni-security = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rmp-serde = "1.3"
csv = "1.3"

[dev-dependencies]
tokio = { workspace = true }
