[package]
name = "omni-system"
version = "0.1.0"
edition = "2021"
description = "System tracing (strace/eBPF), cron engine, universal ID generator (UUID/ULID/Snowflake), WCAG color toolkit, and SVG flamegraph generator for OMNI"
authors = ["Rajveersinh Pardeshi <daveaddams91@gmail.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
omni-core = { workspace = true }
omni-registry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
