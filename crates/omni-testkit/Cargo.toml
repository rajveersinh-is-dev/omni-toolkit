[package]
name = "omni-testkit"
version = "0.1.0"
edition = "2021"
description = "Test harnesses, fuzzing generators, and statistical benchmark verification for OMNI"
authors = ["Rajveersinh Pardeshi <daveaddams91@gmail.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
omni-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread"] }
