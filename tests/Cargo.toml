[package]
name = "omni-tests"
version = "0.1.0"
edition = "2021"
description = "System-level integration, security sandboxing, fuzzing, and regression tests for OMNI"
authors = ["Rajveersinh Pardeshi <daveaddams91@gmail.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
omni-core = { workspace = true }
omni-registry = { workspace = true }
omni-pipeline = { workspace = true }
omni-security = { workspace = true }
omni-encoders = { workspace = true }
omni-crypto = { workspace = true }
omni-text = { workspace = true }
omni-pcap = { workspace = true }
omni-filesystems = { workspace = true }
omni-visualization = { workspace = true }
omni-testkit = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true }

[[test]]
name = "integration_pipeline"
path = "integration/pipeline_test.rs"

[[test]]
name = "security_sandboxing"
path = "security/sandbox_test.rs"

[[test]]
name = "fuzz_decoders"
path = "fuzz/fuzz_test.rs"

[[test]]
name = "regression_tests"
path = "regression/regression_test.rs"
