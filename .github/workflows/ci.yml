name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo Format Check
        run: cargo fmt --all -- --check

      - name: Cargo Check (all targets)
        run: cargo check --workspace --all-targets

      - name: Build CLI binary for E2E tests
        run: cargo build -p omni

      - name: Cargo Test (workspace)
        run: cargo test --workspace

      - name: Cargo Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo Doc check
        run: cargo doc --workspace --no-deps

      - name: Verify native desktop WebView build (Windows/macOS)
        if: matrix.os == 'windows-latest' || matrix.os == 'macos-latest'
        run: cargo check -p omni-desktop --features native-webview
